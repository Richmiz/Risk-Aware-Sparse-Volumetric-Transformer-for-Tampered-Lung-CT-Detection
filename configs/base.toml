[project]
name = "RSVT lung CT medical deepfake detection"
stage = "scaffold"

[paths]
raw = "data/raw"
interim = "data/interim"
processed = "data/processed"
manifests = "data/manifests"
splits = "data/splits"
outputs = "outputs"

[data]
split_unit = "source_volume_id"
require_patient_disjoint = true
derivatives_follow_source_partition = true

[input]
representation = "3d_ct"
primary_format = "dicom"
normalize_hu = true
harmonize_orientation = true

[training]
selection_data = "source_validation_only"
candidate_seeds = [13, 37, 73, 101, 137]

[evaluation]
primary_metric = "fb_recall_at_fixed_fpr"
secondary_metrics = ["macro_f1", "tamper_auroc", "worst_generator_auroc", "ece", "latency_p50", "latency_p95", "flops"]
confidence_level = 0.95
bootstrap_replicates = 1000
bootstrap_unit = "source_volume_id"
localization_requires_verified_annotations = true

[protocol]
status = "pilot_required"
pending_decisions = [
    "target voxel spacing and HU window",
    "3D token sizes and volume aggregation",
    "FPR target and validation threshold rule",
    "numeric compute budgets and profiling hardware",
    "loss weights and final CVaR alpha",
    "patient/source identity reconciliation and final partitions",
]
