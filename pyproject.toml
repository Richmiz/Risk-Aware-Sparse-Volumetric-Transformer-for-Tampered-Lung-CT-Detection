[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsvt-medical-deepfake"
version = "0.1.0"
description = "Research scaffold for risk-aware sparse volumetric medical deepfake detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
inventory = ["pydicom==3.0.2", "stream-unzip==0.0.101"]
preprocessing = ["pydicom==3.0.2", "numpy>=1.26,<3", "SimpleITK==2.5.7"]
annotation_review = ["pydicom==3.0.2", "numpy>=1.26,<3", "ipywidgets==8.1.8"]
training = ["torch>=2.6,<3", "pydicom==3.0.2", "numpy>=1.26,<3", "SimpleITK==2.5.7"]
research = [
    "torch",
    "monai",
    "pydicom",
    "SimpleITK",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "tqdm",
    "tensorboard",
]
dev = ["pytest", "ruff"]

[project.scripts]
rsvt = "rsvt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
